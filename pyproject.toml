[project]
name = "backtester"
version = "0.1.0"
description = "Event-driven strategy backtesting engine."
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "httpx",
    "langgraph>=0.2,<1",
    "matplotlib",
    "numpy",
    "pandas",
    "pydantic",
    "python-dotenv>=1.0,<2",
    "pyarrow",
    "uvicorn",
    "yfinance",
]

[project.optional-dependencies]
ai-langchain = [
    "langchain-openai>=0.3,<1",
]
dev = [
    "matplotlib",
    "mypy",
    "pandas-stubs",
    "pytest",
    "pytest-cov",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_decorators = false

[project.scripts]
backtester = "backtester.cli:main"

