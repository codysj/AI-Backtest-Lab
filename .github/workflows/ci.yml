name: CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest
      - name: Run mypy
        run: python -m mypy backtester

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      # Runtime vulnerabilities should block delivery. Development-only audit
      # findings are reported by dependency tooling but must not make the
      # application build nondeterministically fail on deprecated lint-tool
      # transitive packages that are never shipped in the Next.js bundle.
      - name: Audit frontend runtime dependencies
        run: |
          for attempt in 1 2 3; do
            if npm audit --omit=dev --audit-level=high; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Runtime dependency audit failed after 3 attempts." >&2
              exit 1
            fi
            echo "Audit attempt $attempt failed; retrying in 5 seconds." >&2
            sleep 5
          done
      - name: Run frontend lint
        run: npm run lint
      - name: Run frontend typecheck
        run: npm run typecheck
      - name: Build frontend
        run: npm run build
